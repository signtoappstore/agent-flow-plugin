# AgentFlow — config của MỘT repo. `/agentflow:init` copy file này vào root repo rồi điền value.
# Commit được: KHÔNG BAO GIỜ chứa secret (secret nằm ở env của .claude/settings.local.json).
# Mỗi key chỉ giữ thứ không suy ra được từ git. Kiểm tra: /agentflow:doctor

schema: 5                      # version của file này, không phải của plugin
lang: vi                       # ngôn ngữ agent viết issue/comment/PR

# ── BOARD ────────────────────────────────────────────────────────────────────
board:
  url: null                    # BẮT BUỘC — https://github.com/orgs/<org>/projects/<N> hoặc /users/<login>/projects/<N>
  # Stage của plugin → tên option Status THẬT trên board (khớp từng ký tự).
  status:
    backlog: "Backlog"               # PO — agent chỉ tạo issue vào đây
    ready: "Ready"                   # PO đã kéo vào — SA thiết kế (giải pháp, rủi ro, test case), rồi DEV nhặt
    in_progress: "In Progress"       # DEV code + flow automation, deploy staging, chạy flow, tự sửa / sửa theo review
    in_review: "In Review"           # flow đã pass trên staging — SA review
    in_qc: "In QC"                   # chờ QC người test mục QC tay của PR
    ready_to_merge: "Ready to Merge" # người approve + merge
    done: "Done"
  # Field tuỳ chọn trên board. Xoá key nếu board không có field đó.
  fields:
    priority: "Priority"       # option đầu tiên = ưu tiên cao nhất
    size: "Size"               # option cuối (vd XL) = phải tách trước khi làm

# ── PHÂN LOẠI ISSUE ──────────────────────────────────────────────────────────
classify: issue-type           # issue-type (issue type của org) | label
types:                         # tên type (hoặc label) → tiền tố nhánh/commit
  Feature: feat
  Improvement: improve
  Bug: fix
  Task: chore

# Tên label thật trên repo cho từng tín hiệu (init tạo nếu thiếu).
labels:
  agent: "agentflow"                     # ticket do agent sở hữu (SA gắn khi thiết kế xong)
  blocked: "blocked"                     # chờ người gỡ — loop bỏ qua
  needs_info: "needs-info"               # thiếu thông tin — loop bỏ qua
  changes_requested: "changes-requested" # SA review trả về — DEV sửa
  qc_failed: "qc-failed"                 # QC người trả về — DEV sửa
  qc_manual: "qc-manual"                 # chờ QC người test tay theo checklist
  # Nền tảng ticket chạm — một issue gắn được nhiều label. Key = tên nền tảng mà surfaces.<key>.platform trỏ tới.
  platform:
    mobile: "platform:mobile"
    web: "platform:web"
    backend: "platform:backend"

# ── GIT ──────────────────────────────────────────────────────────────────────
git:
  base: null                   # nhánh gốc: việc mới tạo từ origin/<base> vừa fetch, PR nhắm vào đây; null = master
  protected: []                # nhánh không bao giờ push thẳng (hook chặn), vd [production]. Không ghi nhánh staging
  branch: "{type}/{issue}-{slug}"   # {type} lấy từ bảng types
  commit: "{type}({surface}): {subject}"
  link: "Closes"               # từ khoá trong PR body — merge xong issue tự đóng

# ── SURFACES (tuỳ chọn) ──────────────────────────────────────────────────────
# Bỏ hẳn block này nếu repo một khối. Lệnh chạy từ thư mục `path`, phải exit 0.
# surfaces:
#   web:
#     path: "web/"
#     platform: "web"          # key của labels.platform ứng với surface
#     check: "pnpm typecheck && pnpm lint"
#     test: "pnpm test"
#     e2e: ""                  # tuỳ chọn — lệnh chạy cả suite e2e nhắm vào staging, có env STAGING_URL, vd "BASE_URL=$STAGING_URL pnpm e2e"
#     e2e_dir: ""              # tuỳ chọn — thư mục test e2e trong surface, vd ".maestro" (Maestro, ưu tiên cho UI) hoặc "e2e": DEV commit flow vào đây
#     install: ""              # mobile, tuỳ chọn — build + cài bản trỏ server staging lên emulator/simulator đang chạy,
#                              # vd "flutter build apk --flavor staging && adb install -r build/app/outputs/flutter-apk/app-staging-release.apk"

# ── E2E MAP (tuỳ chọn) ───────────────────────────────────────────────────────
# Path bị đổi (glob tính từ root repo) → tag của flow có sẵn trong e2e_dir. `agentflow-e2e select` dùng để gợi ý
# flow regression cho SA, nhất là khi diff chỉ chạm backend (flow UI không chứa path code backend). Flow gắn tag vùng, vd tags: [inbox].
e2e_map: {}
#   "backend/services/notification/**": [inbox]

# Glob agent KHÔNG được sửa hay in nội dung (hợp với mặc định của plugin: .env*, *.pem, *.key, *.p12, *.pfx, *.jks, *.keystore, .netrc, .git-credentials, id_rsa, id_ed25519).
forbidden: []

# ── DESIGN (tuỳ chọn) ────────────────────────────────────────────────────────
design:
  figma: false                 # true = issue có link Figma → SA/DEV dùng Figma MCP
  repo: []                     # path tài liệu thiết kế sản phẩm/prototype trong repo, vd ["docs/design/"] — /agentflow:task đọc để nắm sản phẩm

# ── STAGING (bắt buộc) ───────────────────────────────────────────────────────
# Nhánh chỉ để build và test: DEV merge dồn nhánh ticket vào đây rồi chạy flow, không bao giờ merge ngược về PR hay master.
staging:
  branch: "staging"            # BẮT BUỘC — phải tồn tại trên origin, khác git.base
  url: ""                      # URL API/web của môi trường staging. Trống ⇒ test case API/web thành mục QC tay
  build: ""                    # cách lấy bản build cho mobile/QC người, vd "artifact APK của workflow staging-release"
  notes: ""                    # app id, tài khoản/dữ liệu test: path secret folder của project (gitignored), vd "secret/staging/" — agent đọc file trong đó
  timeout_min: 30              # pipeline quá thời gian này ⇒ blocked, báo người
  skip_checks: []              # glob tên check DEV không chờ — release mobile, vd ["distribute-mobile*", "testflight*"]
  skip_ci: true                # merge commit DEV push lên staging có [skip ci] ⇒ workflow on: push không tự chạy, chỉ chạy
                               # qua dispatch bên dưới. false = để CI tự chạy khi push. Thiếu key ⇒ true
  # Workflow DEV tự dispatch trên staging.branch, không hỏi người: ref luôn là staging, inputs chỉ lấy ở đây. Rerun job fail
  # (≤ 2 lần mỗi run) và cancel run cũ áp cho mọi run của nhánh staging, không cần khai. Không khai workflow deploy production,
  # không khai workflow build/distribute mobile (mặc định không build CI mobile — người chạy tay khi cần; flow mobile dùng
  # bản DEV build trên máy, surfaces.<key>.install).
  workflows: []
  #  - file: "deploy-staging.yml"
  #    when: push               # push = dispatch sau mỗi lần DEV push staging
  #                             # need = chỉ khi cần, vd chạy seed/migration riêng
  #    inputs: { env: staging } # tuỳ chọn — giá trị cố định
  #    wipe: "wipe_data"        # tuỳ chọn — input boolean xoá dữ liệu staging. DEV tự bật khi cần (migration không tương
  #                             # thích, seed đổi, dữ liệu bẩn làm flow sai); bị từ chối khi ticket khác đang In QC/chạy flow

# ── LÀM RÕ YÊU CẦU ───────────────────────────────────────────────────────────
# auto = agent tự phân tích, chọn phương án tốt nhất và hợp nhất, ghi quyết định + căn cứ để người soát sau.
# ask  = agent đưa phương án cho người chọn, rồi liệt kê việc sẽ làm để người xác nhận lần cuối mới làm.
# Thiếu key (hoặc thiếu cả block) ⇒ ask.
clarify:
  task: ask                    # /agentflow:task — ask: hỏi PO, xác nhận danh sách issue sẽ ghi · auto: tự chọn, ghi mục "Giả định" vào ticket
  implement: ask               # trước khi DEV code — auto: SA tự chọn giải pháp · ask: SA đưa phương án ([AF:SA] options), người chọn + xác nhận
                               # "Sẽ thực hiện" (/do hỏi trong terminal, /run hỏi qua GitHub với label needs_info)

# ── NGƯỜI (GitHub login, để @mention) ────────────────────────────────────────
people:
  po: []
  qc: []
  reviewers: []

# ── LOOP ─────────────────────────────────────────────────────────────────────
run:
  parallel: 2                  # số ticket xử lý song song (git worktree)
  max_tasks: 5                 # số ticket đưa tới cổng người mỗi lượt /agentflow:run
  max_review_rounds: 3         # số ❌ review liên tiếp; lần kế tiếp → escalate
  max_qc_rounds: 2             # số lần QC người fail cho đến khi pass; lần kế tiếp → escalate
  max_test_rounds: 3           # số vòng DEV tự sửa khi flow fail trên staging trong một lượt; hết vòng → lỗi block lên issue
  max_regression: 6            # số flow có sẵn tối đa SA chọn chạy lại mỗi ticket (ngoài flow của ticket); phần dư → Đề xuất kiểm chứng thêm
  models:
    dev: { default: opus }        # thêm key theo Size để đổi model, vd L: fable. Effort nằm ở frontmatter của agent
    sa: opus                     # SA thiết kế trước DEV + review. Config bản 2.x ghi `reviewer:` vẫn được đọc

# ── NOTIFY ───────────────────────────────────────────────────────────────────
notify:
  telegram: false              # cần TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID trong env
  events: [blocked, needs_info, qc_manual, ready_to_merge]
